[package]
name = "language-jutsu"
version = "0.1.0"
edition = "2024"
description = "Prepare foreign-language recordings for repeated listening practice"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
genanki-rs = "0.4.0"
hf-hub = { version = "1", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
whisper-rs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

# cmake-rs builds whisper.cpp unoptimized at opt-level 0; `cargo run` must stay usable.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[dev-dependencies]
rusqlite = "0.25.4"
zip = { version = "0.5.13", default-features = false }
