[package]
name = "language-jutsu"
version = "0.1.0"
edition = "2024"
description = "Prepare foreign-language recordings for repeated listening practice"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
genanki-rs = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[dev-dependencies]
rusqlite = "0.25.4"
zip = { version = "0.5.13", default-features = false }
